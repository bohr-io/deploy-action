name: bohr.io Cloud deploy
description: Deploy a bohr.io Cloud managed project (a Worker with static assets) from GitHub Actions.
author: bohr.io
branding:
  icon: upload-cloud
  color: purple

inputs:
  instance-url:
    description: Base URL of the bohr instance that manages the project.
    required: false
    default: https://app.bohr.io
  working-directory:
    description: Directory that holds the project's wrangler.jsonc (or wrangler.json), relative to the repository root.
    required: false
    default: .
  credentials:
    description: >-
      "true" for a project in its owner's Cloudflare account: only get the production deploy's credentials from
      bohr (build variables to the environment of the next steps, the Cloudflare token and account to this
      step's outputs) and deploy nothing.
    required: false
    default: "false"
  build-plan:
    description: >-
      "true" for a project bohr hosts whose repository keeps bohr v1's workflow (bohr-io/action): ask bohr for
      the project's build plan and deploy nothing. Without one, the output found is "false" and nothing else
      happens. With one, the plan's files are written into the workspace, the build variables go to the
      environment of the next steps (masked) and the outputs found, node-version, install and build are set.
    required: false
    default: "false"
  phase:
    description: With build-plan "true", the step to run. Only "prepare" exists.
    required: false
    default: prepare

outputs:
  url:
    description: URL where the deployed branch is served.
  deployment-id:
    description: Identifier of the deployment on the bohr instance.
  cloudflare-api-token:
    description: With credentials "true", the Cloudflare API token to deploy with (masked).
  cloudflare-account-id:
    description: With credentials "true", the Cloudflare account to deploy to (masked).
  found:
    description: With build-plan "true", "true" when bohr has a build plan for this repository, else "false".
  node-version:
    description: With build-plan "true", the Node.js version to set up (actions/setup-node's node-version).
  install:
    description: With build-plan "true", the install command (empty for none).
  build:
    description: With build-plan "true", the build command (empty for none).
  live:
    description: With build-plan "true", "true" when the project's production address already moved to bohr.io v2 (a failed v2 deploy must then fail instead of falling back to bohr v1).

runs:
  using: node24
  main: dist/index.js

  live:
    description: build-plan mode. "true" when the project's production address already moved to bohr.io v2 (a failed deploy must not fall back to bohr v1).